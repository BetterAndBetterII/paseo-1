experiment: desktop_interaction
defaults:
  variant: baseline
  scale: full
hypothesis: Earlier partial virtualization with a smaller recent Desktop-web timeline window
  reduces tab-switch latency and renderer memory without breaking timeline continuity
entrypoint:
  type: shell
  command: npm run benchmark -- desktop-interaction --output {run_dir}/benchmark.json
params:
  heavy_tabs: [1, 4, 8]
  history_items: [50, 100, 176]
  measured_switches: 12
metrics:
  file: benchmark.json
  primary: tasks.0.cases.8.metrics.bodyConsistent.values.p95
  secondary:
    - tasks.0.cases.8.metrics.titleBodyMismatch.values.p95
    - tasks.0.cases.8.metrics.footprint.values.inactiveTimelineDomNodes
    - tasks.0.cases.8.metrics.heap.values.used
gates:
  correctness:
    - target title and visible timeline body agree after every measured switch
    - seeded newest prompt is visible before a case is measured
    - no browser request or WebSocket can reach port 6767
  regression:
    - provider epoch, cursor, messageId, and gap behavior remain covered by existing timeline tests
    - active and scrolled-away timeline behavior remains covered by targeted agent-stream tests
