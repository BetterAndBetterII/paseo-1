experiment: desktop_interaction
runs:
  - variant: baseline
    scale: full
  - variant: web_virtualization_threshold_50
    scale: full
    change: lower only the web partial-virtualization activation threshold from 100 to 50 items
    status: accepted
    rollback: keep the product default at 100
  - variant: web_recent_window_20
    scale: full
    change: lower only the mounted recent web stream window from 50 to 20 items
    status: accepted
    rollback: keep the product default at 50
  - variant: desktop_inactive_agent_unmount
    scale: full
    status: deferred
    reason: changes panel lifecycle and scroll restoration; test lower-risk virtualization knobs first
  - variant: css_interaction_fast_path
    scale: full
    status: deferred
    reason: addresses feedback latency but not the multi-gigabyte retained timeline root
