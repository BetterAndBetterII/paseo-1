experiment: desktop_markdown_performance
runs:
  - variant: baseline_current_renderer
    priority: P0
    scale: full
    status: ready
    change: no product change; freeze the real Markdown workload and diagnostic timings

  - variant: bounded_live_tail_renderer
    priority: P0
    scale: full
    status: rejected
    change: keep completed blocks stable and render only the growing final block through a bounded plain or deferred path
    primary_scope: one MiB mixed Markdown feedback, frame gaps, and Long Task time
    rollback: fully render the growing final block on every update
    reason: one MiB Long Task p95 improved 52 percent, but end-to-end improved only 4 percent and frame-gap p95 regressed 26 percent

  - variant: incomplete_fence_plain_during_stream
    priority: P0
    scale: full
    status: ready_after_baseline
    change: skip syntax highlighting only for an incomplete streaming fence; highlight on close or completion
    primary_scope: unclosed code feedback delay and Long Task time
    rollback: highlight every streaming prefix

  - variant: completed_only_byte_bounded_highlight_cache
    priority: P0
    scale: full
    status: queued
    change: cache completed highlights only and evict by retained bytes rather than entry count alone
    primary_scope: long-session post-GC heap and cache retention
    rollback: restore the 200-entry content-keyed cache

  - variant: shared_markdownit_instance
    priority: P0
    scale: full
    status: queued
    change: reuse one immutable configured MarkdownIt instance instead of one per assistant message
    primary_scope: history mount heap and switch latency
    rollback: restore per-message MarkdownIt construction

  - variant: adaptive_visible_markdown_cadence
    priority: P1
    scale: full
    status: deferred_until_live_tail_result
    change: keep reducer semantics unchanged but reduce visible Markdown commits for large growing blocks
    primary_scope: one MiB React commits, frame gaps, and feedback delay
    rollback: render every 48ms reducer flush

  - variant: memoized_block_containers
    priority: P1
    scale: full
    status: queued
    change: memoize stable top-level block containers and keyed block projection
    primary_scope: mixed Markdown React duration and wrapper commits
    rollback: render all block wrappers on every message update

  - variant: message_scoped_style_boundary
    priority: P1
    scale: full
    status: queued
    change: hoist repeated per-block theme and style setup to message scope
    primary_scope: history mount and mixed Markdown block creation
    rollback: retain one AppearanceStyleBoundary and renderer setup per block

  - variant: lazy_file_link_resolution
    priority: P1
    scale: full
    status: queued
    change: avoid disabled per-message query observers and resolve link metadata only when a link needs it
    primary_scope: link-dense history heap and commits
    rollback: retain the current per-message and per-link observers

  - variant: bounded_code_rendering
    priority: P1
    scale: full
    status: design_required
    change: cap mounted token or line nodes with Show more while preserving full copy content
    primary_scope: 100KiB completed code DOM, AX, layout, and feedback delay
    rollback: mount every highlighted token span

  - variant: offscreen_stream_ui_pause
    priority: P1
    scale: full
    status: queued
    change: stop hidden retained agent shells from committing on each visible-stream cadence
    primary_scope: background CPU with four and eight streaming tabs
    rollback: retain the current frozen-array shell subscription behavior

  - variant: long_message_block_virtualization
    priority: P2
    scale: full
    status: deferred
    change: virtualize blocks inside one exceptionally long message
    reason: high scroll, selection, measurement, and accessibility risk

  - variant: streamdown_web_renderer
    priority: P2
    scale: full
    status: deferred
    change: replace only the Electron and browser renderer with Streamdown in an ablation
    reason: not a React Native drop-in and does not inherently solve a massive changing last block

  - variant: split_markdown_blocks_optimization
    priority: P3
    scale: full
    status: rejected_until_profile_changes
    reason: measured cumulative cost was 0.42ms for 47 prefixes of a one MiB plain payload

  - variant: height_hash_optimization
    priority: P3
    scale: full
    status: rejected_until_profile_changes
    reason: measured cumulative cost was 25ms while browser layout exceeded 860ms for the same payload
